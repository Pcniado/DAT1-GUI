name: Build .NET App with VGMStream

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Download and extract vgmstream-cli.exe
      run: |
        $vgmstreamDir = "$(Join-Path $env:RUNNER_TEMP 'vgmstream')"
        $vgmstreamZip = "$vgmstreamDir\vgmstream-win.zip"
        $vgmstreamExe = "$vgmstreamDir\vgmstream-cli.exe"
        $vgmstreamUrl = "https://github.com/vgmstream/vgmstream/releases/latest/download/vgmstream-win.zip"

        if (!(Test-Path $vgmstreamDir)) {
          New-Item -ItemType Directory -Path $vgmstreamDir | Out-Null
        }

        if (!(Test-Path $vgmstreamExe)) {
          Invoke-WebRequest -Uri $vgmstreamUrl -OutFile $vgmstreamZip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($vgmstreamZip, $vgmstreamDir)
          Remove-Item $vgmstreamZip -Force
        }

        echo "VGMSTREAM downloaded to $vgmstreamDir"
      shell: pwsh

    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }}

    - name: Publish
      run: dotnet publish --configuration ${{ matrix.configuration }} --output ./publish/${{ matrix.configuration }}

    - name: Copy vgmstream-cli.exe into published folder
      run: |
        Copy-Item "$env:RUNNER_TEMP\vgmstream\vgmstream-cli.exe" -Destination "./publish/${{ matrix.configuration }}/vgmstream-cli.exe"
      shell: pwsh

    - name: Upload published build
      uses: actions/upload-artifact@v4
      with:
        name: published-app
        path: ./publish/${{ matrix.configuration }}
